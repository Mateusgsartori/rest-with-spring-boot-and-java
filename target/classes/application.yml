cors:
  originPatterns: http://localhost:8080,http://localhost:5173
file:
  upload-dir: /a/upload-dir
security:
  jwt:
    token:
      secret-key: 53cr37
      expire-length: 3600000
email:
  subject: "Default subject"
  message: "Default message"
spring:
  application:
    name:  rest-with-spring-boot-and-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spring_application_new?useTimezone=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size:  200MB
      max-request-size: 215MB
logging:
  level:
    rest-with-spring-boot-and-java: DEBUG
spring-doc:
  paths-to-match:
  - /auth/**
  - /api/**/**
  swagger-ui:
    use-root-path: true

